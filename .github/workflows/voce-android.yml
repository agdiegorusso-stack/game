name: Voce Flutter APK
on:
  push:
    branches: ['voce/flutter-apk']
    paths: ['voce/**', '.github/workflows/voce-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voce-flutter-apk
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: voce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter sources
        run: flutter analyze
      - name: Test interface and persistence
        run: flutter test --reporter expanded
      - name: Test ranking and backend
        run: |
          dart test/domain_smoke.dart
          cd backend
          python3 -m unittest discover -p 'test*.py' -v
          python3 -m py_compile ../browser/*.py
          node --check ../browser/extract.js
      - name: Build optimized ARM64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Voce-0.2.0-Android-arm64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs dist/Voce-0.2.0-Android-arm64.apk > dist/signature-verification.txt
          "$BT/aapt" dump badging dist/Voce-0.2.0-Android-arm64.apk > dist/apk-info.txt
      - name: Upload APK and verification
        uses: actions/upload-artifact@v4
        with:
          name: Voce-0.2.0-Android-arm64
          path: voce/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Voce-interface-preview
          path: voce/build-report/
          if-no-files-found: ignore
          retention-days: 14
