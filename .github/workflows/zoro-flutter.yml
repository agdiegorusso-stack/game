name: Zoro Forge Flutter APK
on:
  push:
    branches: ['zoro-forge/flutter-apk']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zoro-flutter-apk
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Build project when sources are ready
        run: |
          if [ ! -f tool/build_android.sh ]; then
            echo 'Compiler ready; source upload in progress.'
            exit 0
          fi
          bash tool/build_android.sh
      - name: Collect APK and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zoro-Forge-Flutter-Android
          path: |
            dist/
            build-report/
          if-no-files-found: ignore
          retention-days: 14
