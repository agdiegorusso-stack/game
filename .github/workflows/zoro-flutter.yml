name: Zoro Forge Flutter APK
on:
  push:
    branches: ['zoro-forge/flutter-apk']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zoro-flutter-apk
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Prepare existing Dojo version
        run: |
          mkdir -p build-report
          python3 tool/upgrade_dojo.py
          flutter pub get
      - name: Reproduce the previous scroll-state crash
        shell: bash
        run: |
          set +e
          flutter test test/scroll_state_test.dart --plain-name 'Dojo footer scroll 360' --reporter expanded 2>&1 | tee build-report/regression-before.log
          RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$RESULT" -eq 0 ]; then
            echo 'Expected pre-fix failure was not reproduced.'
            exit 1
          fi
          grep -E "double.*bool|bool.*double" build-report/regression-before.log
      - name: Isolate disclosure states from page scroll offsets
        run: python3 tool/fix_scroll_state.py
      - name: Analyze test and build native Flutter APK
        run: bash tool/build_android.sh
      - name: Collect local packaging tools and sources
        if: always()
        run: |
          mkdir -p dist/packaging
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" dist/packaging/apksigner.jar
          cp "$BT/zipalign" dist/packaging/zipalign
          cp "$BT/aapt" dist/packaging/aapt
          if [ -d "$BT/lib64" ]; then cp -r "$BT/lib64" dist/packaging/; fi
          zip -qr dist/source.zip lib assets test tool android_overlay pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Collect APK and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zoro-Forge-Flutter-Android
          path: |
            dist/
            build-report/
          if-no-files-found: ignore
          retention-days: 14
