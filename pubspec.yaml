name: zoro_forge
description: Diario allenamenti e attività GPS in Flutter.
publish_to: none
version: 2.0.0-beta.2+20002
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  video_player: ^2.14.0
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  cross_file: ^0.3.4+2
  wakelock_plus: ^1.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
